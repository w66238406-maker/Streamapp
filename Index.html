<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamApp - Films & Séries</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1115;
            color: #ffffff;
            padding: 15px;
        }

        header {
            max-width: 1000px;
            margin: 0 auto 20px auto;
        }

        h1 {
            color: #f3ce13;
            font-size: 24px;
            margin-bottom: 15px;
        }

        /* Barre de recherche et filtres */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2a2e39;
            background: #1a1d24;
            color: white;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #f3ce13;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 16px;
            border-radius: 20px;
            background: #1a1d24;
            color: #a0a5b5;
            border: none;
            cursor: pointer;
        }

        .filter-btn.active {
            background: #f3ce13;
            color: #000;
            font-weight: bold;
        }

        /* Lecteur vidéo principal */
        .player-container {
            max-width: 1000px;
            margin: 0 auto 25px auto;
            background: #1a1d24;
            border-radius: 12px;
            padding: 15px;
            display: none;
        }

        video {
            width: 100%;
            border-radius: 8px;
            background: black;
            max-height: 450px;
        }

        .player-title {
            margin-top: 10px;
            font-size: 18px;
            color: #f3ce13;
        }

        .player-desc {
            font-size: 14px;
            color: #a0a5b5;
            margin-top: 5px;
        }

        /* Grille des films */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: #1a1d24;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-info {
            padding: 10px;
        }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 12px;
            color: #a0a5b5;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>L'union fait la force</h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Rechercher un film ou une série...">
            <button onclick="searchMedia()">Chercher</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="setFilter('all', this)">Tous</button>
            <button class="filter-btn" onclick="setFilter('movie', this)">Films</button>
            <button class="filter-btn" onclick="setFilter('tv', this)">Séries</button>
        </div>
    </header>

    <!-- Zone de lecture vidéo -->
    <div class="player-container" id="playerContainer">
        <video id="videoPlayer" controls poster="">
            <source id="videoSource" src="" type="video/mp4">
            Votre navigateur ne supporte pas la lecture vidéo.
        </video>
        <div class="player-title" id="playerTitle">Titre</div>
        <div class="player-desc" id="playerDesc">Description...</div>
    </div>

    <!-- Grille d'affichage -->
    <div class="grid" id="mediaGrid"></div>

    <script>
        const API_KEY = 'e865f573d09a80fa940e7ab29828236d'; // Clé API publique de démonstration
        let currentFilter = 'all';

        // Charger les films populaires au démarrage
        window.onload = () => {
            loadTrending();
        };

        function setFilter(type, element) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            currentFilter = type;
            searchMedia();
        }

        async function loadTrending() {
            const url = `https://api.themoviedb.org/3/trending/all/week?api_key=${API_KEY}&language=fr-FR`;
            fetchAndDisplay(url);
        }

        async function searchMedia() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                loadTrending();
                return;
            }

            let url = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&language=fr-FR&query=${encodeURIComponent(query)}`;
            fetchAndDisplay(url, true);
        }

        async function fetchAndDisplay(url, filterResults = false) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '<p>Chargement...</p>';

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                grid.innerHTML = '';

                let results = data.results || [];
                if (currentFilter !== 'all') {
                    results = results.filter(item => item.media_type === currentFilter);
                }

                if (results.length === 0) {
                    grid.innerHTML = '<p>Aucun résultat trouvé.</p>';
                    return;
                }

                results.forEach(item => {
                    const title = item.title || item.name;
                    const date = item.release_date || item.first_air_date || 'N/A';
                    const year = date.split('-')[0];
                    const poster = item.poster_path 
                        ? `https://image.tmdb.org/t/p/w500${item.poster_path}` 
                        : 'https://via.placeholder.com/500x750?text=Pas+d+image';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${poster}" alt="${title}">
                        <div class="card-info">
                            <div class="card-title">${title}</div>
                            <div class="card-meta">${item.media_type === 'tv' ? 'Série' : 'Film'} • ${year} • ★ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'}</div>
                        </div>
                    `;

                    card.onclick = () => playMedia(title, item.overview, poster);
                    grid.appendChild(card);
                });
            } catch (error) {
                grid.innerHTML = '<p>Erreur lors du chargement des données.</p>';
                console.error(error);
            }
        }

        function playMedia(title, overview, poster) {
            const container = document.getElementById('playerContainer');
            const player = document.getElementById('videoPlayer');
            const source = document.getElementById('videoSource');
            const titleEl = document.getElementById('playerTitle');
            const descEl = document.getElementById('playerDesc');

            // Vidéo d'exemple HTML5 (Remplacez l'URL par votre propre lien .mp4 si besoin)
            source.src = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";
            player.poster = poster;
            player.load();
            
            titleEl.textContent = title;
            descEl.textContent = overview || "Aucune description disponible.";

            container.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
